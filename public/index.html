<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Progres Gim XII RPL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--cd:#1c2140;--tx:#eef1f8;--mu:#9aa3c7;--ac:#22d3ee;--or:#fb923c;--gr:#4ade80;--bd:#33396a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',Arial,sans-serif;line-height:1.45;padding:20px}
main{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:32px}p{margin:0}.mu{color:var(--mu)}
.top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
button{font:inherit;font-weight:700;background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.s{background:transparent;color:var(--mu);border:1px solid var(--bd)}button.d{background:var(--or)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--cd);border-radius:12px;padding:14px;border-top:5px solid var(--ac)}.stat b{font-size:30px;display:block}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;gap:14px;align-items:center;cursor:pointer}.rk{font-size:26px;font-weight:700;color:var(--or);min-width:42px}
.bar{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gr))}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-size:13px}
.tg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:var(--bg)}.Belum{background:#6b7399}.Proses{background:var(--or)}.Selesai{background:var(--gr)}
.tw{overflow-x:auto}.dt{display:none;flex-direction:column;gap:10px}.card.o .dt{display:flex}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:760px;width:calc(100% - 24px);padding:20px}dialog::backdrop{background:#000a}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fr{display:grid;grid-template-columns:130px 110px 1fr;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:560px){.fr{grid-template-columns:1fr}}
.chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.cr{display:grid;grid-template-columns:minmax(110px,170px) 1fr 44px;gap:6px 8px;align-items:center;font-size:13px;max-height:430px;overflow:auto;margin-top:8px}.cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cp{text-align:right;color:var(--mu)}.sb{display:flex;height:12px;background:#6b7399;border-radius:8px;overflow:hidden}.sb i{display:block;height:100%}.em{opacity:.6}.fb{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><main>
<div class="top"><div><h1>🎮 Progres Gim XII RPL</h1><p class="mu">Papan progres semua siswa · berdasarkan Mini GDD · diperbarui otomatis</p></div>
<div style="display:flex;gap:8px"><button class="s" id="gu">Mode guru</button><button id="isi">Isi / perbarui progresku</button></div></div>
<div class="stats" id="stats"></div><div class="chg" id="ch"></div><div class="fb"><input id="q" placeholder="Cari nama siswa…" style="max-width:300px"><select id="fl" style="max-width:220px"><option value="">Semua siswa</option><option value="belum">Belum mengisi</option><option value="jalan">Sedang berjalan</option><option value="100">Sudah 100%</option></select></div><div id="list" style="display:flex;flex-direction:column;gap:12px"></div>

<dialog id="dlg"><form method="dialog" id="f" style="display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;color:var(--ac)">Progres Pengembangan Gim</h2>
<p class="mu" style="font-size:14px">Semua isian ini tampil di papan progres. PIN (4–6 angka) dipakai agar hanya kamu yang bisa mengubah datamu.</p>
<div class="g"><label>Nama<select id="nm" required><option value="">Pilih namamu</option><option>Achmad Pauzi</option><option>Akbar Rizky</option><option>Alfharezy Ginanza</option><option>Alifian Banyu Adi Sucipto</option><option>Bima Saputra</option><option>Bunga Fathia Ferrylla</option><option>Fabian Absyar Noviyanto</option><option>Fadlan Alrafi Kurniawan</option><option>Farizky Adrian</option><option>Gilang Noverykho</option><option>Katong Rohullah Ajienegoro</option><option>Muhamad Zacky Afghan</option><option>Muhammad Aldo Alfiansyah</option><option>Muhammad Evans Fauzan</option><option>Muhammad Haekal Jaelani</option><option>Muhammad Rafan Rizqiansyah</option><option>Nail Andrean Sumadi</option><option>Najwa Salwa Abhista</option><option>Putra Ardiansyah</option><option>Putra Bagja Wardhana</option><option>Radika Agus Pratama</option><option>Raffi Pasha Islami</option><option>Rafi Ahmad Sahroni</option><option>Revan Putra Aditya</option><option>Rio Cahya Fajar</option><option>Saputra</option><option>Sapwan Al Bukhori</option><option>Shafwan Auli Putra</option><option>Tania Maudunah</option><option>Tiara Septya Ramadany</option></select></label><label>Kelas<input id="kl" value="XII RPL" readonly></label><label>PIN<input id="pin" type="password" inputmode="numeric" maxlength="6" required></label>
<label>Judul gim<input id="gm" maxlength="60"></label><label>Pertemuan ke- (angka, untuk grafik garis)<input id="pt" inputmode="numeric" maxlength="3"></label></div>
<div id="pr"></div>
<div class="g"><label>Kendala utama<textarea id="kd" maxlength="300"></textarea></label><label>Target pertemuan berikutnya<textarea id="tg" maxlength="300"></textarea></label></div>
<p id="er" style="color:var(--or)"></p>
<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="s" id="bt">Batal</button><button type="button" id="sv">Simpan</button></div></form></dialog>
<dialog id="gdlg" style="max-width:380px"><div style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;color:var(--ac);font-size:20px">Masuk Mode Guru</h2><label>Kunci guru<input id="gk" type="password" autocomplete="off"></label><p id="ge" style="color:var(--or);font-size:14px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="s" id="gcl">Batal</button><button type="button" id="gok">Masuk</button></div></div></dialog>
</main><script>
var P=["Game Overview","Story & Concept","Gameplay","Mechanics 1","Mechanics 2","Mechanics 3","Character","Level & Objective","UI / HUD","Art & Audio"];
var $=function(i){return document.getElementById(i)},D=[],GK=sessionStorage.getItem("gk")||"";
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function pct(o){var n=0;o.st.forEach(function(x){n+=x==="Selesai"?1:x==="Proses"?.5:0});return Math.round(n*10)}
function ago(t){var m=Math.round((Date.now()-t)/6e4);return m<1?"baru saja":m<60?m+" mnt lalu":m<1440?Math.round(m/60)+" jam lalu":Math.round(m/1440)+" hari lalu"}
function api(m,b){return fetch("/api/progress",{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error("API belum aktif. Pastikan situs sudah di-deploy ke Vercel (folder api terbaca) dan database Upstash terhubung.")}if(!r.ok)throw new Error(j.error||"Gagal");return j})})}
var NM=[].slice.call($("nm").options).slice(1).map(function(o){return o.value});
function all(){var m={};D.forEach(function(o){m[o.name]=1});var L=D.slice();NM.forEach(function(n){if(!m[n])L.push({name:n,kelas:"XII RPL",empty:true,st:P.map(function(){return"Belum"}),ct:[],updated:0,id:""})});return L}
function lineSvg(pts){if(!pts.length)return'<p class="mu" style="font-size:13px">Belum ada riwayat. Isi kolom "Pertemuan ke-" saat menyimpan progres.</p>';
 var W=400,H=170,L=34,B=26,T=14,R=14,n=pts.length,iw=W-L-R,ih=H-T-B;
 function X(i){return L+(n===1?iw/2:i*iw/(n-1))}function Y(v){return T+ih-v*ih/100}
 var g=[0,50,100].map(function(v){return'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--bd)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" style="fill:var(--mu)">'+v+"</text>"}).join("");
 var ln=pts.map(function(q,i){return X(i)+","+Y(q.y)}).join(" ");
 var dots=pts.map(function(q,i){return'<circle cx="'+X(i)+'" cy="'+Y(q.y)+'" r="4.5" style="fill:var(--ac)"/><text x="'+X(i)+'" y="'+(Y(q.y)-9)+'" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--tx)">'+q.y+'</text><text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" style="fill:var(--mu)">P'+q.x+"</text>"}).join("");
 return'<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto">'+g+(n>1?'<polyline points="'+ln+'" fill="none" stroke-width="3" style="stroke:var(--ac)"/>':"")+dots+"</svg>"}
function classLine(){var xs=[];D.forEach(function(o){(o.hist||[]).forEach(function(h){if(xs.indexOf(h.k)<0)xs.push(h.k)})});xs.sort(function(a,b){return a-b});
 return xs.map(function(x){var v=[];D.forEach(function(o){var l=null;(o.hist||[]).forEach(function(h){if(h.k<=x)l=h});if(l)v.push(l.p)});return{x:x,y:v.length?Math.round(v.reduce(function(a,b){return a+b},0)/v.length):0}})}
function render(){
 var L=all();L.sort(function(a,b){if(!!a.empty!==!!b.empty)return a.empty?1:-1;if(a.empty)return a.name.localeCompare(b.name);return pct(b)-pct(a)||b.updated-a.updated});
 var r=0;L.forEach(function(o){o.rk=o.empty?"–":"#"+(++r)});
 var n=D.length,avg=n?Math.round(D.reduce(function(s,o){return s+pct(o)},0)/n):0,fin=D.filter(function(o){return pct(o)===100}).length;
 $("stats").innerHTML='<div class="stat"><b>'+n+'/'+L.length+'</b>siswa sudah mengisi</div><div class="stat" style="border-color:var(--or)"><b>'+avg+'%</b>rata-rata progres</div><div class="stat" style="border-color:var(--gr)"><b>'+fin+'</b>sudah 100%</div><div class="stat" style="border-color:#6b7399"><b>'+(L.length-n)+'</b>belum mengisi</div>';
 var c1='<div class="card"><b>Progres per siswa</b><div class="cr">'+L.map(function(o){return'<div class="cl'+(o.empty?" em":"")+'">'+esc(o.name)+'</div><div class="bar"><i style="width:'+pct(o)+'%"></i></div><div class="cp">'+pct(o)+'%</div>'}).join("")+'</div></div>';
 var c2='<div class="card"><b>Status per bagian GDD</b><p class="mu" style="font-size:13px">Hijau = selesai · oranye = proses · abu-abu = belum (dari siswa yang sudah mengisi)</p><div class="cr" style="grid-template-columns:minmax(100px,130px) 1fr">'+P.map(function(nm,k){var a=0,b=0;D.forEach(function(o){if(o.st[k]==="Selesai")a++;else if(o.st[k]==="Proses")b++});var t=n||1;return'<div class="cl">'+nm+'</div><div><div class="sb"><i style="width:'+a*100/t+'%;background:var(--gr)"></i><i style="width:'+b*100/t+'%;background:var(--or)"></i></div><span class="mu" style="font-size:12px">Selesai '+a+" · Proses "+b+" · Belum "+(n-a-b)+"</span></div>"}).join("")+'</div></div>';
 var c3='<div class="card"><b>Perkembangan kelas per pertemuan</b><p class="mu" style="font-size:13px">Rata-rata progres siswa pada tiap pertemuan</p>'+lineSvg(classLine())+"</div>";$("ch").innerHTML=c3+c1+c2;
 var q=$("q").value.trim().toLowerCase(),f=$("fl").value;
 var V=L.filter(function(o){return(!q||o.name.toLowerCase().indexOf(q)>-1)&&(f==="belum"?o.empty:f==="jalan"?(!o.empty&&pct(o)<100):f==="100"?pct(o)===100:true)});
 var open={};document.querySelectorAll(".card.o").forEach(function(c){open[c.dataset.id]=1});
 if(!V.length){$("list").innerHTML='<div class="card mu">Tidak ada siswa yang cocok.</div>';return}
 $("list").innerHTML=V.map(function(o){var p=pct(o),key=o.id||o.name;
  var dt;
  if(o.empty)dt='<p class="mu">Belum mengisi progres.</p>';
  else{var rows=P.map(function(nm,k){return"<tr><td>"+nm+'</td><td><span class="tg '+o.st[k]+'">'+o.st[k]+"</span></td><td>"+esc(o.ct[k])+"</td></tr>"}).join("");
   var g=GK?'<div class="g"><label>Umpan balik guru<textarea id="fb'+o.id+'">'+esc(o.feedback)+'</textarea></label><label>Nilai<input id="nl'+o.id+'" value="'+esc(o.nilai)+'" maxlength="3"></label></div><div style="display:flex;gap:8px"><button data-a="fb" data-id="'+o.id+'">Simpan umpan balik</button><button class="d" data-a="del" data-id="'+o.id+'">Hapus siswa</button></div>':"";
   dt='<div><b style="font-size:14px">Perkembangan progres</b>'+lineSvg((o.hist||[]).map(function(h){return{x:h.k,y:h.p}}))+'</div><div class="tw"><table><tr><th>Bagian GDD</th><th>Status</th><th>Bukti / catatan</th></tr>'+rows+"</table></div><p><b>Kendala:</b> "+esc(o.kendala||"-")+"</p><p><b>Target berikutnya:</b> "+esc(o.target||"-")+"</p>"+(o.feedback?'<p style="color:var(--gr)"><b>Guru:</b> '+esc(o.feedback)+(o.nilai?" · Nilai "+esc(o.nilai):"")+"</p>":"")+g}
  return'<div class="card'+(open[key]?" o":"")+(o.empty?" em":"")+'" data-id="'+esc(key)+'"><div class="hd"><div class="rk">'+o.rk+'</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b style="font-size:19px">'+esc(o.name)+' <span class="mu" style="font-weight:400;font-size:14px">'+esc(o.kelas)+'</span></b><span class="mu" style="font-size:14px">'+(o.empty?"Belum mengisi":esc(o.game||"(belum ada judul)")+" · "+ago(o.updated))+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div><b style="font-size:22px;color:var(--ac)">'+p+'%</b></div><div class="dt">'+dt+"</div></div>"}).join("")}
$("q").oninput=render;$("fl").onchange=render;
function load(){api("GET").then(function(d){D=d;render()}).catch(function(e){$("list").innerHTML='<div class="card" style="color:var(--or)">'+esc(e.message)+"</div>"})}
$("list").onclick=function(e){var t=e.target,id=t.dataset.id;
 if(t.dataset.a==="fb"){api("POST",{teacherKey:GK,id:id,feedback:$("fb"+id).value,nilai:$("nl"+id).value}).then(load).catch(function(x){alert(x.message)});return}
 if(t.dataset.a==="del"){if(confirm("Hapus data siswa ini?"))api("DELETE",{teacherKey:GK,id:id}).then(load).catch(function(x){alert(x.message)});return}
 if(t.closest("textarea,input,button,table"))return;var c=t.closest(".card");if(c&&c.dataset.id)c.classList.toggle("o")};
$("pr").innerHTML=P.map(function(n,i){return'<div class="fr"><b style="font-size:14px">'+n+'</b><select id="s'+i+'"><option>Belum</option><option>Proses</option><option>Selesai</option></select><input id="c'+i+'" maxlength="150" placeholder="Bukti / catatan singkat"></div>'}).join("");
try{var me=JSON.parse(localStorage.getItem("gdd-me")||"{}");$("nm").value=me.n||"";$("pin").value=me.p||""}catch(e){}
function fill(){var o=D.filter(function(x){return x.name===$("nm").value})[0]||{};
 $("gm").value=o.game||"";$("pt").value=o.pertemuan||"";$("kd").value=o.kendala||"";$("tg").value=o.target||"";
 P.forEach(function(n,i){$("s"+i).value=(o.st||[])[i]||"Belum";$("c"+i).value=(o.ct||[])[i]||""})}
$("isi").onclick=function(){$("er").textContent="";fill();$("dlg").showModal()};
$("nm").onchange=fill;
$("bt").onclick=function(){$("dlg").close()};
$("sv").onclick=function(){var st=[],ct=[];P.forEach(function(n,i){st.push($("s"+i).value);ct.push($("c"+i).value)});
 var b={name:$("nm").value,kelas:$("kl").value,pin:$("pin").value,game:$("gm").value,pertemuan:$("pt").value,st:st,ct:ct,kendala:$("kd").value,target:$("tg").value};
 api("POST",b).then(function(){try{localStorage.setItem("gdd-me",JSON.stringify({n:b.name,k:b.kelas,p:b.pin}))}catch(e){}$("dlg").close();load()}).catch(function(e){$("er").textContent=e.message})};
$("gu").onclick=function(){if(GK){GK="";sessionStorage.removeItem("gk");$("gu").textContent="Mode guru";render();return}
 $("gk").value="";$("ge").textContent="";$("gdlg").showModal();$("gk").focus()};
function masuk(){var k=$("gk").value;if(!k)return;$("gok").disabled=true;
 api("POST",{teacherKey:k}).then(function(){GK=k;sessionStorage.setItem("gk",k);$("gu").textContent="Keluar mode guru";$("gdlg").close();render()}).catch(function(e){$("ge").textContent=e.message}).then(function(){$("gok").disabled=false})}
$("gok").onclick=masuk;$("gcl").onclick=function(){$("gdlg").close()};
$("gk").onkeydown=function(e){if(e.key==="Enter")masuk()};
if(GK)$("gu").textContent="Keluar mode guru";
load();setInterval(load,30000);
</script></body></html>
